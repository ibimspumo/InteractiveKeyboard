name: Release

# Wird ausgelöst durch einen Tag-Push der Form v1.2.3
# oder manuell über die GitHub-UI ("Run workflow").
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust Setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: NPM Install
        run: npm ci

      - name: Release-Notes laden
        id: notes
        shell: bash
        run: |
          file="release-notes/${{ github.ref_name }}.md"
          if [ -f "$file" ]; then
            {
              echo 'body<<RELEASE_NOTES_EOF'
              cat "$file"
              echo
              echo 'RELEASE_NOTES_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'body<<RELEASE_NOTES_EOF'
              echo "## Interactive Keyboard ${{ github.ref_name }}"
              echo
              echo "Keine Release-Notes hinterlegt (`release-notes/${{ github.ref_name }}.md` fehlt). Siehe Commit-Historie."
              echo 'RELEASE_NOTES_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Release via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri-Updater signing-keys. Wenn du den Updater aktivieren willst,
          # generiere lokal `npx @tauri-apps/cli signer generate` und lege
          # private key + password als GitHub-Secrets ab.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Interactive Keyboard ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release publizieren
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) {
              core.setFailed(`Release ${tag} nicht gefunden`);
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
            });
            core.info(`Release ${tag} publiziert`);
